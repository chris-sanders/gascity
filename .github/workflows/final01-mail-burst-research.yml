name: FINAL-01 fork-only replicated mail burst research

on:
  push:
    branches:
      - codex/final01-mail-burst-research-20261101

permissions:
  contents: read

jobs:
  compare:
    name: Compare real mail delivery on one hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: 9564d8919c5ce07dcfc1e6cf76f50d12ada32c14
      IMAGE_TAG: final01-mail-burst:9564d891
      PRIOR_IMAGE_ID: sha256:2d6312e7af89de2640b23f9d82172b9cf5a8dffcf8b9085a7fcbd3efa5f31183
      WHEEL_URL: https://files.pythonhosted.org/packages/6b/50/2a923c4dc02522ff9567f07c67ed1deca6d5fa9474f4708168b8088dfa37/gitpython-3.2.1-py3-none-any.whl
      WHEEL_SHA256: d66b0832aa8755c1a84892937282df0befb16c97e5a64aeebd68be9c5e323f53
    steps:
      - name: Checkout research harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: research
          persist-credentials: false
      - name: Checkout exact candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: chris-sanders/gascity
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Record source and runner
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          {
            printf 'candidate_source=%s\n' "$SOURCE_SHA"
            printf 'research_commit=%s\n' "$(git -C research rev-parse HEAD)"
            uname -a
            nproc
            lscpu
            free -h
            df -h .
            docker version
            sha256sum source/contrib/k8s/Dockerfile.mail source/.github/requirements/mcp-agent-mail.txt research/research/final01-mail-burst.py research/.github/workflows/final01-mail-burst-research.yml
          } > evidence/source-and-runner.txt
      - name: Build the standard candidate mail image
        id: image
        run: |
          set -euo pipefail
          docker build -f source/contrib/k8s/Dockerfile.mail -t "$IMAGE_TAG" source
          docker image inspect --format 'image_id={{.Id}}' "$IMAGE_TAG" | tee evidence/image-id.txt
          printf 'prior_image_id=%s\n' "$PRIOR_IMAGE_ID" | tee -a evidence/image-id.txt
      - name: Obtain and verify the official GitPython 3.2.1 wheel
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$WHEEL_URL" -o evidence/gitpython-3.2.1-py3-none-any.whl
          printf '%s  %s\n' "$WHEEL_SHA256" evidence/gitpython-3.2.1-py3-none-any.whl | sha256sum -c -
          sha256sum evidence/gitpython-3.2.1-py3-none-any.whl > evidence/wheel-sha256.txt
      - name: Run three alternating-order pairs of 400 real sends
        id: trials
        run: |
          set -euo pipefail
          host_snapshot() {
            local path="$1"
            {
              date -u '+%Y-%m-%dT%H:%M:%SZ'
              uptime
              cat /proc/loadavg
              free -m
              for resource in cpu io memory; do
                if [ -r "/proc/pressure/$resource" ]; then printf '%s ' "$resource"; cat "/proc/pressure/$resource"; fi
              done
            } > "$path"
          }
          run_trial() {
            local kind="$1" cid rc vmstat_pid=''
            shift
            host_snapshot "evidence/${kind}-before.txt"
            cid="$(docker create --name "final01-burst-${GITHUB_RUN_ID}-${kind}" --cpus 2 --memory 4g \
              -v "$GITHUB_WORKSPACE/research/research/final01-mail-burst.py:/tmp/mail-burst.py:ro" \
              "$@")"
            docker inspect --format 'nano_cpus={{.HostConfig.NanoCpus}} memory_bytes={{.HostConfig.Memory}} ulimits={{json .HostConfig.Ulimits}}' "$cid" > "evidence/${kind}-container-config.txt"
            if command -v vmstat >/dev/null 2>&1; then
              vmstat -w -t 2 > "evidence/${kind}-vmstat.log" & vmstat_pid=$!
            fi
            if timeout --signal=TERM --kill-after=10s 600s docker start -a "$cid" > "evidence/${kind}.log" 2>&1; then rc=0; else rc=$?; fi
            docker inspect --format '{{json .State}}' "$cid" > "evidence/${kind}-container-state.json" || true
            docker rm -f "$cid" >/dev/null || true
            if [ -n "$vmstat_pid" ] && [ "$(ps -p "$vmstat_pid" -o comm= | tr -d ' ')" = vmstat ]; then kill "$vmstat_pid" || true; fi
            if [ -n "$vmstat_pid" ]; then wait "$vmstat_pid" || true; fi
            host_snapshot "evidence/${kind}-after.txt"
            printf '%s\n' "$rc" > "evidence/${kind}.exit"
            printf '%s exit=%s\n' "$kind" "$rc"
            if [ "$rc" -ne 0 ]; then return "$rc"; fi
          }
          run_baseline() {
            local kind="$1"
            run_trial "$kind" --entrypoint python3 "$IMAGE_TAG" /tmp/mail-burst.py "hosted-${kind}"
          }
          run_new() {
            local kind="$1"
            run_trial "$kind" \
              -v "$GITHUB_WORKSPACE/evidence/gitpython-3.2.1-py3-none-any.whl:/tmp/gitpython-3.2.1-py3-none-any.whl:ro" \
              --entrypoint /bin/sh "$IMAGE_TAG" -c \
              'set -eu; python3 -m pip install --no-deps --no-cache-dir --target /tmp/gitpython-new /tmp/gitpython-3.2.1-py3-none-any.whl; export PYTHONPATH=/tmp/gitpython-new; exec python3 /tmp/mail-burst.py "$1"' sh "hosted-${kind}"
          }
          run_baseline baseline-1
          run_new gitpython321-1
          run_new gitpython321-2
          run_baseline baseline-2
          run_baseline baseline-3
          run_new gitpython321-3
      - name: Validate all pairs and summarize without deciding acceptance
        id: summary
        if: ${{ always() && steps.trials.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('evidence')
          fields=('EFFECTIVE_PACKAGES','EXPERIMENT_ENV','INDEX_INITIAL','INDEX_FINAL','INBOX_SUMMARY','REQUEST_LATENCY','RESULT')
          pairs=[]
          reference=None
          for number in (1,2,3):
              pair={'number':number,'order':['baseline','gitpython321'] if number != 2 else ['gitpython321','baseline']}
              for kind,expected in (('baseline','3.1.62'),('gitpython321','3.2.1')):
                  name=f'{kind}-{number}'
                  rc=int((root/f'{name}.exit').read_text())
                  values={}
                  for line in (root/f'{name}.log').read_text(errors='replace').splitlines():
                      for key in fields:
                          prefix=key+' '
                          if line.startswith(prefix): values[key]=json.loads(line[len(prefix):])
                  missing=[key for key in fields if key not in values]
                  if rc != 0 or missing:
                      raise SystemExit(f'{name}: incomplete trial exit={rc} missing={missing}')
                  if values['EXPERIMENT_ENV']['gitpython'] != expected or values['EFFECTIVE_PACKAGES'].get('gitpython') != expected:
                      raise SystemExit(f'{name}: incorrect effective GitPython version')
                  if values['REQUEST_LATENCY']['request_count'] != 400 or values['REQUEST_LATENCY']['service_count'] != 400 or values['RESULT']['success']+len(values['RESULT']['errors']) != 400:
                      raise SystemExit(f'{name}: 400 attempts were not accounted for')
                  packages=values['EFFECTIVE_PACKAGES'].copy(); packages.pop('gitpython')
                  if reference is None: reference=packages
                  if packages != reference:
                      raise SystemExit(f'{name}: effective package inventories differ beyond GitPython')
                  pair[kind]=values
              pairs.append(pair)
          output={'pairs':pairs,'note':'Research only: comparable measurements do not decide performance or security acceptance.'}
          (root/'summary.json').write_text(json.dumps(output,indent=2,sort_keys=True)+'\n')
          for pair in pairs:
              for kind in ('baseline','gitpython321'):
                  values=pair[kind]
                  print('pair',pair['number'],'order',pair['order'],'version',kind,json.dumps({key:values[key] for key in ('EXPERIMENT_ENV','INDEX_INITIAL','INDEX_FINAL','INBOX_SUMMARY','REQUEST_LATENCY','RESULT')}))
          print(output['note'])
          PY
      - name: Upload research logs and metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final01-mail-burst-replicates-9564d891
          path: |
            evidence/source-and-runner.txt
            evidence/image-id.txt
            evidence/wheel-sha256.txt
            evidence/*.log
            evidence/*.exit
            evidence/*-container-state.json
            evidence/*-container-config.txt
            evidence/*-before.txt
            evidence/*-after.txt
            evidence/summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Require complete comparable trials
        if: ${{ always() }}
        env:
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
          TRIAL_OUTCOME: ${{ steps.trials.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          printf 'image=%s trials=%s summary=%s\n' "$IMAGE_OUTCOME" "$TRIAL_OUTCOME" "$SUMMARY_OUTCOME"
          [[ "$IMAGE_OUTCOME" == success && "$TRIAL_OUTCOME" == success && "$SUMMARY_OUTCOME" == success ]]
